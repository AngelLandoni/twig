[package]
name = "twig"
version = "0.1.0"
edition = "2021"
description = "Instant, nearly free git branches to work on in parallel: a copy-on-write clone of your repo (build cache included) on its own branch."
license = "MIT"

[lib]
name = "twig"
path = "src/lib.rs"

[[bin]]
name = "twig"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
diffy = "0.5"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
